<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 400px;
            padding: 20px;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 15px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            background: #f5f5f5;
            border: none;
            border-bottom: 3px solid transparent;
            font-weight: bold;
        }
        .tab.active {
            background: white;
            border-bottom-color: #007bff;
            color: #007bff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            font-weight: bold;
        }
        .real { background-color: #d4edda; color: #155724; }
        .fake { background-color: #f8d7da; color: #721c24; }
        .unknown { background-color: #fff3cd; color: #856404; }
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
        .settings {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
        }
        input {
            width: 100%;
            padding: 5px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        .participants-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            margin: 10px 0;
        }
        .participant-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            background: white;
        }
        .participant-item:last-child {
            border-bottom: none;
        }
        .participant-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .participant-status.real {
            background-color: #28a745;
        }
        .participant-status.fake {
            background-color: #dc3545;
        }
        .participant-status.unknown {
            background-color: #ffc107;
        }
        .participant-info {
            flex: 1;
        }
        .participant-id {
            font-weight: bold;
            font-size: 12px;
            color: #333;
        }
        .participant-details {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
        .participant-confidence {
            font-size: 11px;
            font-weight: bold;
            margin-left: 10px;
        }
        .no-participants {
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }
        .refresh-btn {
            background-color: #28a745;
            font-size: 12px;
            padding: 5px 10px;
        }
        .refresh-btn:hover {
            background-color: #218838;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
        }
        .stat-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>Spoof Detection</h3>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="control">Control</button>
        <button class="tab" data-tab="participants">Participants</button>
    </div>

    <!-- Control Tab -->
    <div id="control-tab" class="tab-content active">
        <div id="status" class="status unknown">
            Detection Inactive
        </div>

        <div class="controls">
            <button id="toggleDetection">Start Detection</button>
            <button id="clearResults">Clear</button>
        </div>

        <div class="settings">
            <label>Backend URL:</label>
            <input type="text" id="backendUrl" value="http://localhost:8000/api" placeholder="Backend URL">
            <button id="saveSettings">Save Settings</button>
        </div>

        <div id="lastResult" style="margin-top: 15px; font-size: 12px; color: #666;">
            No recent detections
        </div>
    </div>

    <!-- Participants Tab -->
    <div id="participants-tab" class="tab-content">
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="realCount" style="color: #28a745;">0</div>
                <div class="stat-label">Real</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="fakeCount" style="color: #dc3545;">0</div>
                <div class="stat-label">Fake</div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h4 style="margin: 0;">All Participants</h4>
            <button id="refreshParticipants" class="refresh-btn">Refresh</button>
        </div>

        <div class="participants-list" id="participantsList">
            <div class="no-participants">
                No participants detected yet
            </div>
        </div>

        <div style="font-size: 10px; color: #666; margin-top: 10px; text-align: center;">
            Last updated: <span id="lastUpdated">Never</span>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
